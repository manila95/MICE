defaults:
  # seed for random number generator
  seed: 0
  # training configurations
  train_cfgs:
    # device to use for training, options: cpu, cuda, cuda:0, cuda:0,1, etc.
    device: cpu
    # number of threads for torch
    torch_threads: 16
    # number of vectorized environments
    vector_env_nums: 1
    # number of parallel agent, similar to a3c
    parallel: 1
    # total number of steps to train
    total_steps: 1000000
    # number of evaluate episodes
    eval_episodes: 1
  # algorithm configurations
  algo_cfgs:
    # number of steps to update the policy
    steps_per_epoch: 2000
    # number of steps per sample
    update_cycle: 1
    # number of iterations to update the policy
    update_iters: 1
    # The size of replay buffer
    size: 1000000
    # The size of batch
    batch_size: 256
    # normalize reward
    reward_normalize: False
    # normalize cost
    cost_normalize: True
    # normalize observation
    obs_normalize: False
    # max gradient norm
    max_grad_norm: 40
    # use critic norm
    use_critic_norm: False
    # critic norm coefficient
    critic_norm_coeff: 0.001
    # The soft update coefficient
    polyak: 0.005
    # The discount factor of GAE
    gamma: 0.99
    # Actor perdorm random action before `start_learning_steps` steps
    start_learning_steps: 10000
    # The delay step of policy update
    policy_delay: 2
    # Whether to use the exploration noise
    use_exploration_noise: False
    # The exploration noise
    exploration_noise: 0.1
    # The policy noise
    policy_noise: 0.2
    # policy_noise_clip
    policy_noise_clip: 0.5
    # The value of alpha
    alpha: 0.2
    # Whether to use auto alpha
    auto_alpha: False
    # use cost
    use_cost: True
    # warm up epoch
    warmup_epochs: 100
  # logger configurations
  logger_cfgs:
    # use wandb for logging
    use_wandb: True
    # wandb project name
    wandb_project: omnisafe
    # use tensorboard for logging
    use_tensorboard: True
    # save model frequency
    save_model_freq: 100
    # save logger path
    log_dir: "./runs"
    # save model path
    window_lens: 10
  # model configurations
  model_cfgs:
    # weight initialization mode
    weight_initialization_mode: "kaiming_uniform"
    # actor type
    actor_type: gaussian_sac
    # linear learning rate decay
    linear_lr_decay: False
    # Configuration of Actor network
    actor:
      # Size of hidden layers
      hidden_sizes: [256, 256]
      # Activation function
      activation: relu
      # The learning rate of Actor network
      lr: 0.0001
    # Configuration of Critic network
    critic:
      # The number of critic networks
      num_critics: 2
      # Size of hidden layers
      hidden_sizes: [256, 256]
      # Activation function
      activation: relu
      # The learning rate of Critic network
      lr: 0.0003
    # whether to replace the independent reward/cost Q-critics with read-out heads over a
    # single shared successor-representation Q-function
    use_successor_representation: False
    # successor representation configurations, only used when use_successor_representation is True
    sr_cfgs:
      # 'shared_trunk': shared feature trunk over (obs, act) + linear reward/cost read-out
      # heads, trained end-to-end by the ordinary one-step Bellman MSE loss (reuses the stock
      # off-policy critic update code exactly).
      # 'td_ridge': literal successor representation -- phi(s,a)/psi(s,a) trained by a one-step
      # TD backup off the target trunk, with the reward/cost read-out weights solved by
      # closed-form ridge regression each update.
      sr_mode: shared_trunk
      # dimensionality of the shared successor-feature vector
      sr_dim: 256
      # hidden layer sizes of the shared trunk / psi network -- every layer's width is
      # overridden to sr_dim at construction time (only the depth, i.e. len(hidden_sizes),
      # is actually used; a narrower last layer would silently cap psi/phi's rank below sr_dim)
      hidden_sizes: [256, 256]
      # activation function of the trunk
      activation: relu
      # learning rate for the trunk (shared_trunk mode) or the psi network (td_ridge mode)
      lr: 0.0003
      # discount factor for the successor-feature TD recursion (td_ridge mode only);
      # defaults to algo_cfgs.gamma when null
      gamma_sr: ~
      # ridge regression L2 regularization coefficient for solving w_r / w_c (td_ridge mode only)
      ridge_kappa: 0.001
      # EMA smoothing coefficient for w_r / w_c across iterations, 1.0 = no smoothing (td_ridge mode only)
      ema_tau: 1.0
      # how the reward/cost read-out weights w_r / w_c are learned (td_ridge mode only):
      #   'ridge': closed-form ridge regression of the immediate reward/cost onto phi each batch
      #            (uses ridge_kappa / ema_tau above; w_r / w_c are buffers).
      #   'sgd'  : learn w_r / w_c by gradient descent on the same regression. Since the read-out
      #            r(s,a) ~= phi(s,a) . w is policy-independent, it accumulates over the whole
      #            replay buffer; principled when phi is frozen (phi_source: random / separate),
      #            where the regression target is stationary. w_r / w_c become parameters tracked
      #            onto the target trunk by polyak (no ridge_kappa / ema_tau sync).
      readout: ridge
      # learning rate for the sgd read-out weights (readout: sgd only); null = reuse sr_cfgs.lr
      w_lr: ~
      # where phi comes from (td_ridge mode only). In the off-policy Q flavors "s" below is
      # really the raw (obs, act) pair, since the ridge regresses the immediate reward onto phi.
      #   'trunk'    : phi = normalize(Linear(trunk(s))), a read-out of the same trunk psi is
      #                read from. Nothing optimizes phi, but it drifts anyway because the trunk
      #                beneath it is trained by the psi TD loss and the value losses -- so psi is
      #                fit against a feature stream that moves during the fit, and the ridge
      #                basis shifts out from under the w_r / w_c solved on it.
      #   'random'   : phi = normalize(Linear(s)), frozen at init -- a fixed random projection of
      #                the raw input. Stationary, but an affine map cannot raise rank: phi's
      #                effective rank is capped at obs_dim + 1 however large sr_dim is (measured
      #                18 of 64 on a 17-dim obs), and the ridge can only fit near-affine
      #                rewards/costs. A lower-bound baseline; 'separate' is the full-rank
      #                nonlinear version of the same stationarity idea.
      #   'separate' : phi = normalize(MLP(s)) on the raw input, frozen at init -- fixed deep
      #                random features. Stationary like 'random' but nonlinear, and its depth is
      #                set independently of the trunk's (which 'trunk' mode cannot do, since phi
      #                and psi are both single read-outs of one shared body there).
      phi_source: trunk
      # depth of the standalone phi network (phi_source: 'separate' only); as with sr_cfgs.
      # hidden_sizes above, only the number of layers is used -- every width becomes sr_dim
      phi_hidden_sizes: [64, 64]
      # NOTE: the on-policy sr_cfgs also carries lam_sr, the lambda of the successor-feature
      # lambda-return. It is absent here on purpose: a replay minibatch has no trajectory
      # structure to build a lambda-return from, so the off-policy psi target is a one-step
      # bootstrap. See DDPG._update_successor_features.
  # lagrangian configurations
  lagrange_cfgs:
    # The Kp of PID controller
    pid_kp: 0.000001
    # The Ki of PID controller
    pid_ki: 0.0000001
    # The Kd of PID controller
    pid_kd: 0.0000001
    #The delay of PID controller
    pid_d_delay: 10
    # The exponential moving average alpha of the proportional term of the PID controller.
    pid_delta_p_ema_alpha: 0.95
    # The exponential moving average alpha of the derivative term of the PID controller.
    pid_delta_d_ema_alpha: 0.95
    # Whether to normalize the sum of the cost.
    sum_norm: True
    # Whether to normalize the derivate of the cost.
    diff_norm: False
    # Tolerance of constraint violation
    cost_limit: 25.0
    # The max penalty coefficient
    penalty_max: 100.0
    # Initial value of lagrangian multiplier
    lagrangian_multiplier_init: 0.001

SafetyCarCircle1-v0:
  # algorithm configurations
  algo_cfgs:
    # normalize cost
    cost_normalize: False
    # The value of alpha
    alpha: 0.00001
  # model configurations
  model_cfgs:
    # Configuration of Actor network
    actor:
      # The learning rate of Actor network
      lr: 0.000005
    # Configuration of Critic network
    critic:
      # The learning rate of Critic network
      lr: 0.001
  # lagrangian configurations
  lagrange_cfgs:
    # The Kp of PID controller
    pid_kp: 0.0000005
    # The Ki of PID controller
    pid_ki: 0.00000001
    # The Kd of PID controller
    pid_kd: 0.00000001

