defaults:
  # seed for random number generator
  seed: 0
  # training configurations
  train_cfgs:
    # device to use for training, options: cpu, cuda, cuda:0, cuda:0,1, etc.
    device: cpu
    # number of threads for torch
    torch_threads: 16
    # number of vectorized environments
    vector_env_nums: 1
    # number of parallel agent, similar to a3c
    parallel: 1
    # total number of steps to train
    total_steps: 10000000
  # algorithm configurations
  algo_cfgs:
    # number of steps to update the policy
    steps_per_epoch: 20000
    # number of iterations to update the policy
    update_iters: 10
    # batch size for each iteration
    batch_size: 128
    # target kl divergence
    target_kl: 0.01
    # entropy coefficient
    entropy_coef: 0.0
    # normalize reward
    reward_normalize: False
    # normalize cost
    cost_normalize: False
    # normalize observation
    obs_normalize: True
    # early stop when kl divergence is bigger than target kl
    kl_early_stop: False
    # use max gradient norm
    use_max_grad_norm: True
    # max gradient norm
    max_grad_norm: 40.0
    # use critic norm
    use_critic_norm: True
    # critic norm coefficient
    critic_norm_coef: 0.001
    # critic norm coefficient for the cost critic only; null = reuse critic_norm_coef. Same
    # null-fallback convention as sr_cfgs.ridge_kappa_cost / w_weight_decay_cost.
    critic_norm_coef_cost: ~
    # reward discount factor
    gamma: 0.99
    # cost discount factor
    cost_gamma: 0.99
    # lambda for gae
    lam: 0.95
    # lambda for cost gae
    lam_c: 0.95
    # advantage estimation method, options: gae, retrace
    adv_estimation_method: gae
    cost_adv_estimation_method: ~
    n_val_episodes: 0
    # standardize reward advantage
    standardized_rew_adv: True
    # standardize cost advantage
    standardized_cost_adv: True
    # penalty coefficient
    penalty_coef: 0.0
    # use cost
    use_cost: True
    # Damping value for conjugate gradient
    cg_damping: 0.1
    # Number of conjugate gradient iterations
    cg_iters: 15
    # Subsampled observation
    fvp_obs: None
    # The sub-sampling rate of the observation
    fvp_sample_freq: 1
    # the cost limit
    cost_limit: 25.0
    # the tolerance of cost limit
    distance: 2.0
  # logger configurations
    # eval frequency for the first 100 epochs (higher cadence for early monitoring)
    early_eval_freq: 5
    value_eval_freq: 50
  logger_cfgs:
    # use wandb for logging
    use_wandb: True
    # wandb project name
    wandb_project: omnisafe
    # use tensorboard for logging
    use_tensorboard: True
    # save model frequency
    save_model_freq: 100
    # save logger path
    log_dir: "./runs"
    # save model path
    window_lens: 100
  # model configurations
  model_cfgs:
    # weight initialization mode
    weight_initialization_mode: "kaiming_uniform"
    # actor type, options: gaussian, gaussian_learning
    actor_type: gaussian_learning
    # linear learning rate decay
    linear_lr_decay: False
    # exploration noise anneal
    exploration_noise_anneal: False
    # std upper bound, and lower bound
    std_range: [0.5, 0.1]
    # actor network configurations
    actor:
      # hidden layer sizes
      hidden_sizes: [64, 64]
      # activation function
      activation: tanh
      # out_activation: tanh
      # learning rate
      lr: ~
    critic:
      # hidden layer sizes
      hidden_sizes: [64, 64]
      # activation function
      activation: tanh
      # learning rate
      lr: 0.001
    # whether to use a shared successor-representation value function for reward and cost,
    # instead of two independent critics
    use_successor_representation: False
    # successor representation configurations, only used when use_successor_representation is True
    sr_cfgs:
      # 'shared_trunk': shared feature trunk + linear reward/cost read-out heads, trained
      # end-to-end by the ordinary value-target MSE loss (reuses the stock GAE / GAE-RTG /
      # V-trace / Plain value-target code exactly).
      # 'td_ridge': literal successor representation -- phi/psi trained by TD (using the same
      # estimator machinery above, applied to a vector feature stream), with the reward/cost
      # read-out weights solved by closed-form ridge regression each update.
      sr_mode: shared_trunk
      # when sr_mode is 'td_ridge', train the reward critic the normal way -- a plain MLP
      # Q/V critic with its own optimizer, independent of the SR trunk -- and use the SR trunk
      # for the cost critic only (a single psi head off-policy; no change on-policy, which
      # already has one). The trunk still fits w_r each update for diagnostic parity with the
      # non-cost_only run; it is simply never read out into an actual critic. Ignored (raises)
      # under sr_mode: 'shared_trunk'.
      cost_only: false
      # dimensionality of the shared successor-feature vector
      sr_dim: 64
      # hidden layer sizes of the shared trunk / psi network. Sets the trunk's own hidden
      # widths verbatim -- independent of sr_dim, which only sets the final phi/psi
      # projection's output width. Keep the last width >= sr_dim unless a deliberate
      # bottleneck is wanted: that final phi/psi layer has no nonlinearity, so it can't
      # raise rank above hidden_sizes[-1] (wasted capacity in shared_trunk mode; a
      # rank-deficient, singular-without-regularization ridge Gram matrix in td_ridge mode).
      hidden_sizes: [64, 64]
      # activation function of the trunk
      activation: tanh
      # learning rate for the trunk (shared_trunk mode) or the psi network (td_ridge mode)
      lr: 0.0003
      # lambda for the successor-feature TD target (td_ridge mode only); mirrors lam_c
      lam_sr: 0.95
      # discount factor for the successor-feature TD recursion (td_ridge mode only);
      # defaults to algo_cfgs.gamma when null
      gamma_sr: ~
      # ridge regression L2 regularization coefficient for solving w_r / w_c (td_ridge mode only)
      ridge_kappa: 0.001
      # ridge L2 coefficient for the COST read-out only (td_ridge mode); null = reuse
      # ridge_kappa. Split because the MSE-optimal shrinkage scales with a target's
      # noise-to-signal ratio, and a sparse cost generalizes far worse than a dense reward
      # at the same kappa -- measured train-minus-val RidgeR2 gap on SafetyPointGoal1-v0 was
      # 1.19 for cost against 0.05 for reward, i.e. one shared kappa cannot suit both.
      ridge_kappa_cost: ~
      # EMA smoothing coefficient for w_r / w_c across iterations, 1.0 = no smoothing (td_ridge mode only)
      ema_tau: 1.0
      # read-out weight learning (td_ridge mode): 'ridge' (closed-form each epoch) or 'sgd'
      # (gradient descent over a persistent cross-epoch replay buffer; principled with a frozen
      # phi_source: random / separate). On-policy 'sgd' keeps its own buffer since the rollout
      # buffer is wiped every epoch, so w is still fit over all past experience.
      readout: ridge
      # which transitions the closed-form ridge is solved on (readout: ridge only).
      #   'epoch'       : the fresh epoch's training split (the rollout's own phi).
      #   'buffer'      : the persistent cross-epoch history, recomputing phi under the current
      #                   basis. Valid because the read-out r(s) ~= phi(s).w is policy-independent;
      #                   widens the state coverage the Gram is built from, which is what
      #                   conditions the solve when phi is rank-deficient (phi_source: random).
      #                   Held-out val episodes are never added, so SR/Gap/RidgeR2* stays a
      #                   genuine generalization test.
      #   'cost_replay' : the fresh epoch plus an equal number of past cost-inducing (cost > 0)
      #                   transitions resampled from a dedicated replay buffer -- e.g. at
      #                   steps_per_epoch=5000, tries for 5000 fresh + 5000 replayed rows. Costs
      #                   are typically sparse, so an 'epoch'-only fit rarely sees enough
      #                   cost-positive rows; this concentrates the replay on exactly those rows
      #                   instead of diluting it with 'buffer''s whole (mostly cost-zero) history.
      #                   Both w_r and w_c are solved on the same combined design matrix.
      ridge_data: epoch
      # how many buffered transitions to draw for the solve (ridge_data: buffer only);
      # null = use the entire buffer. Cost is O(N * sr_dim^2), linear in N.
      ridge_buffer_samples: ~
      # capacity of the persistent cost-inducing replay buffer (ridge_data: cost_replay only)
      cost_replay_buffer_size: 1000000
      # learning rate for the sgd read-out weights (readout: sgd only); null = reuse sr_cfgs.lr
      w_lr: ~
      # capacity of the persistent sgd read-out replay buffer (readout: sgd only)
      readout_buffer_size: 1000000
      # gradient steps taken on w_r / w_c per epoch (readout: sgd only)
      readout_grad_steps: 50
      # L2 weight decay on the sgd read-out weights (readout: sgd only) -- the SGD analogue of the
      # ridge kappa; raise it if w_r / w_c overfit (e.g. rank-deficient phi under phi_source: random)
      w_weight_decay: 0.0
      # L2 weight decay on the sgd COST read-out weight only (readout: sgd only); null =
      # reuse w_weight_decay. The SGD analogue of ridge_kappa_cost above.
      w_weight_decay_cost: ~
      # minibatch size for the sgd read-out regression (readout: sgd only), sampled from the
      # persistent buffer independently of the policy update; null = reuse algo_cfgs.batch_size
      readout_batch_size: ~
      # where phi comes from (td_ridge mode only). In the off-policy Q flavors "s" below is
      # really the raw (obs, act) pair, since the ridge regresses the immediate reward onto phi.
      #   'trunk'    : phi = normalize(Linear(trunk(s))), a read-out of the same trunk psi is
      #                read from. Nothing optimizes phi, but it drifts anyway because the trunk
      #                beneath it is trained by the psi TD loss and the value losses -- so psi is
      #                fit against a feature stream that moves during the fit, and the ridge
      #                basis shifts out from under the w_r / w_c solved on it.
      #   'random'   : phi = normalize(Linear(s)), frozen at init -- a fixed random projection of
      #                the raw input. Stationary, but an affine map cannot raise rank: phi's
      #                effective rank is capped at obs_dim + 1 however large sr_dim is (measured
      #                18 of 64 on a 17-dim obs), and the ridge can only fit near-affine
      #                rewards/costs. A lower-bound baseline; 'separate' is the full-rank
      #                nonlinear version of the same stationarity idea.
      #   'separate' : phi = normalize(MLP(s)) on the raw input, frozen at init -- fixed deep
      #                random features. Stationary like 'random' but nonlinear, and its depth is
      #                set independently of the trunk's (which 'trunk' mode cannot do, since phi
      #                and psi are both single read-outs of one shared body there).
      #   'rff'      : phi = normalize(cos(Linear(s))), Random Fourier Features approximating a
      #                Gaussian/RBF kernel of bandwidth phi_rff_bandwidth. Frozen like 'random' /
      #                'separate', but unlike 'separate' its capacity is one interpretable knob
      #                (the bandwidth) instead of an architecture search, and unlike 'random' it
      #                escapes the affine rank cap via the cos nonlinearity.
      #   'ensemble' : concatenates several independent frozen sub-bases (phi_ensemble_sources,
      #                each one of 'random' / 'separate' / 'rff') into one sr_dim-wide phi,
      #                splitting sr_dim evenly across members. Trades one arbitrary random draw
      #                for an average over several; also useful as a diagnostic (via
      #                sr_diagnostics) for which family actually fits the reward/cost signal.
      #   'contrastive': phi = normalize(MLP(s)), same architecture as 'separate' but NOT frozen
      #                -- trained by a time-contrastive InfoNCE loss (see the block below) that
      #                pulls together states visited close in time within an episode and pushes
      #                apart temporally-distant / other-episode ones. Pretrained at epoch 0,
      #                before the first psi TD update / ridge solve ever see it, then continually
      #                fine-tuned every epoch after. On-policy (V flavor) only.
      #   'laplacian': phi = MLP(s) -- same architecture as 'separate' / 'contrastive', trained
      #                by the Augmented Lagrangian Laplacian Objective (ALLO; see the block
      #                below) to be the bottom sr_dim eigenvectors of the transition graph's
      #                Laplacian. Where 'contrastive' asks only that temporally-adjacent states
      #                be close, this asks for the property td_ridge actually needs: those
      #                eigenvectors are, by the variational characterization of the eigenvalue
      #                problem, the sr_dim-dimensional basis in which an arbitrary state signal
      #                is best approximated LINEARLY -- and w_r / w_c are exactly two such linear
      #                approximations. Same cadence as 'contrastive' (pretrained at epoch 0,
      #                fine-tuned every epoch after) and likewise on-policy (V flavor) only.
      #                NOTE: alone among the sources its phi is NOT l2-normalized -- the
      #                orthonormality constraint sets the scale instead, and satisfying it is
      #                what hands the ridge solve an N * I Gram matrix (watch Misc/GramCond).
      phi_source: trunk
      # hidden layer sizes of the standalone phi network (phi_source: 'separate' /
      # 'contrastive' / 'laplacian' only, and any such entries of phi_ensemble_sources). Sets
      # its hidden widths verbatim, independent of sr_dim (which only sets its output width) and of
      # sr_cfgs.hidden_sizes (its depth and width are its own, which is the point of this mode).
      phi_hidden_sizes: [64, 64]
      # draw phi_source: 'random' / 'separate' (and any such phi_ensemble_sources entries) with
      # an orthogonal rather than i.i.d. random first-layer weight matrix (Orthogonal Random
      # Features) -- reduces the variance of the random projection and improves effective-rank
      # utilization of sr_dim for the same obs_dim, at ~zero cost since phi is always
      # re-normalized, so only the projection's directions matter, not its raw scale
      phi_orthogonal_init: false
      # RBF kernel bandwidth (sigma) for phi_source: 'rff' (and any such phi_ensemble_sources
      # entries); larger = smoother/lower-frequency features, smaller = higher-frequency
      phi_rff_bandwidth: 1.0
      # sub-basis families for phi_source: 'ensemble', each one of 'random' / 'separate' / 'rff';
      # null falls back to one of each ['random', 'separate', 'rff']. Ignored unless
      # phi_source: 'ensemble'
      phi_ensemble_sources: ~
      # --- Time-contrastive phi learning (phi_source: 'contrastive' only) ---------------------
      # temperature for the InfoNCE / NT-Xent similarity scaling; lower = sharper, more
      # discriminative positive/negative separation
      phi_contrastive_temperature: 0.1
      # max |timestep offset| within an episode a state pair may be sampled as a positive; both
      # directions (past and future) count, i.e. the true window is +/- this many steps
      phi_contrastive_horizon: 5
      # gradient steps taken on phi at epoch 0, before the first psi TD update / ridge solve --
      # gets phi out of its random-init regime before anything downstream is fit against it
      phi_contrastive_pretrain_steps: 500
      # gradient steps taken on phi every epoch after epoch 0 -- phi is trained continually,
      # never frozen once pretrained
      phi_contrastive_steps_per_epoch: 50
      # minibatch size for the contrastive loss's in-batch-negative InfoNCE; null = reuse
      # algo_cfgs.batch_size
      phi_contrastive_batch_size: ~
      # learning rate for phi's dedicated optimizer (the trained phi sources 'contrastive' /
      # 'laplacian' only); null = reuse sr_cfgs.lr
      phi_lr: ~
      # --- Laplacian phi learning, ALLO (phi_source: 'laplacian' only) ------------------------
      # quadratic barrier coefficient b of the augmented Lagrangian. Unlike the fixed-penalty
      # methods ALLO replaces -- whose equilibrium, and therefore whose recovered features, are an
      # artifact of this coefficient -- the solution here does NOT depend on it: the dual
      # variables below are what make the constraint exact. It only conditions the descent.
      phi_laplacian_barrier: 2.0
      # dual-ascent step size for the Lagrange multipliers enforcing E_rho[phi phi^T] = I. Too
      # large and the multipliers oscillate; too small and phi spends the run with an unsatisfied
      # constraint. Watch Misc/LaplacianOffDiagErr (are the coordinates decorrelating?) against
      # Misc/LaplacianDualNorm (are the multipliers still growing, or have they settled?).
      phi_laplacian_dual_lr: 0.01
      # minibatch size for the objective, deliberately larger than algo_cfgs.batch_size: the
      # constraint is on an sr_dim x sr_dim second moment, so a batch that does not comfortably
      # exceed sr_dim leaves the residual dominated by estimation noise rather than by real
      # correlation. Cheap -- it is a small MLP over states already in memory. Each step draws two
      # independent batches this size (needed for an unbiased barrier gradient) plus one batch of
      # graph edges. null = reuse algo_cfgs.batch_size.
      phi_laplacian_batch_size: 1024
      # learning rate for phi under this objective, overriding phi_lr / sr_cfgs.lr. Deliberately
      # ~10x the trunk's: ALLO has an orthonormality constraint to satisfy from scratch, and at
      # sr_cfgs.lr (3e-4) it simply does not get there within any sane pretrain budget.
      phi_laplacian_lr: 0.003
      # gradient steps taken on phi at epoch 0, before the first psi TD update / ridge solve --
      # gets phi out of its random-init regime before anything downstream is fit against it.
      # Measured on Simple-v0 at sr_dim 16 (LaplacianDiagErr / OffDiagErr / GramCond after the
      # burst): 500 steps at 3e-4 leaves 0.28 / 0.30 / ~4000 -- i.e. no better conditioned than
      # phi_source: trunk -- while 2000 at 3e-3 reaches 0.07 / 0.08 / ~3, which is the N * I Gram
      # this basis exists to produce. 5000 steps buys nothing more. If GramCond is not falling to
      # single digits within a few epochs, this and phi_laplacian_lr are the two knobs to raise.
      phi_laplacian_pretrain_steps: 2000
      # gradient steps taken on phi every epoch after epoch 0 -- phi keeps adapting as the
      # on-policy state distribution shifts, rather than being frozen once pretrained
      phi_laplacian_steps_per_epoch: 50
      # --- SR diagnostics (td_ridge mode only; see PolicyGradient._log_sr_diagnostics) ---
      # number of observations in each phi/psi drift probe set. One probe is drawn once and held
      # for the whole run (drift with the input distribution held constant), the other is redrawn
      # from each epoch's rollout (drift on the states the current policy actually visits).
      probe_size: 512
      # cap on the rows used per split by the diagnostic pass, which runs SVDs and ridge solves
      # over the epoch batch; the metrics are all per-row averages, so subsampling only costs
      # precision, never bias
      diag_max_samples: 4096
  env_cfgs:
    lidar_num_bins: ~
