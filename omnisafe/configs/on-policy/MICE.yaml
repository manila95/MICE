defaults:
  # seed for random number generator
  seed: 0
  # training configurations
  train_cfgs:
    # device to use for training, options: cpu, cuda, cuda:0, cuda:0,1, etc.
    device: cuda:1
    # number of threads for torch
    torch_threads: 16
    # number of vectorized environments
    vector_env_nums: 10
    # number of parallel agent, similar to a3c
    parallel: 1
    # total number of steps to train
    total_steps: 10000000
  # algorithm configurations
  algo_cfgs:
    # number of steps to update the policy
    steps_per_epoch: 20000
    # number of iterations to update the policy
    update_iters: 10
    # batch size for each iteration
    batch_size: 128
    # target kl divergence
    target_kl: 0.01
    # entropy coefficient
    entropy_coef: 0.0
    # normalize reward
    reward_normalize: True
    # normalize cost
    cost_normalize: True
    # normalize observation
    obs_normalize: True
    # early stop when kl divergence is bigger than target kl
    kl_early_stop: False
    # use max gradient norm
    use_max_grad_norm: True
    # max gradient norm
    max_grad_norm: 40.0
    # use critic norm
    use_critic_norm: True
    # critic norm coefficient
    critic_norm_coef: 0.001
    # critic norm coefficient for the cost critic only; null = reuse critic_norm_coef. Same
    # null-fallback convention as sr_cfgs.ridge_kappa_cost / w_weight_decay_cost.
    critic_norm_coef_cost: ~
    # Blend a calibration loss in with the task loss (MSE by default; see algo_cfgs.critic_loss
    # in CPO.yaml/TRPOPID.yaml for the mse/huber toggle, also honored here): pushes predictions to
    # be calibrated in the reliability sense (bucket by predicted value; the average prediction in
    # a bucket should match the average target there) rather than only minimizing average squared
    # error, which a critic can do while still being systematically biased in part of its range.
    # See omnisafe/utils/critic_calibration.py and PolicyGradient._combined_critic_loss.
    use_calibration_loss: False
    # calibration for the cost critic only; null = reuse use_calibration_loss. Same null-fallback
    # convention as critic_norm_coef_cost above -- e.g. leave use_calibration_loss False and set
    # this True to calibrate only the cost critic.
    use_calibration_loss_cost: ~
    # 'binned' (default): regression-ECE-style, catches miscalibration that varies across the
    # prediction range. 'moment': cheap batch-level bias+slope check, no minimum batch size.
    calibration_loss_type: binned
    # calibration loss type for the cost critic only; null = reuse calibration_loss_type.
    calibration_loss_type_cost: ~
    # lambda: total critic loss = (1 - lambda) * task_loss + lambda * calibration_loss.
    # lambda=0 recovers the plain task loss exactly; lambda=1 trains on calibration alone.
    calibration_coef: 0.5
    # calibration lambda for the cost critic only; null = reuse calibration_coef.
    calibration_coef_cost: ~
    # number of equal-population bins (calibration_loss_type: binned only); clamped down to
    # batch_size // 2 per minibatch.
    calibration_bins: 10
    # calibration bin count for the cost critic only; null = reuse calibration_bins.
    calibration_bins_cost: ~
    # reward discount factor
    gamma: 0.99
    # cost discount factor
    cost_gamma: 0.99
    # lambda for gae
    lam: 0.95
    # lambda for cost gae
    lam_c: 0.95
    # advantage estimation method, options: gae, retrace
    adv_estimation_method: gae
    cost_adv_estimation_method: ~
    n_val_episodes: 0
    # standardize reward advantage
    standardized_rew_adv: True
    # standardize cost advantage
    standardized_cost_adv: True
    # penalty coefficient
    penalty_coef: 0.0
    # use cost
    use_cost: True
    # Damping value for conjugate gradient
    cg_damping: 0.1
    # Number of conjugate gradient iterations
    cg_iters: 15
    # Subsampled observation
    fvp_obs: None
    # Tolerance of constraint violation
    cost_limit: 25
    # The sub-sampling rate of the observation
    fvp_sample_freq: 1
    # buf_size
    buf_maxlen: 100
    # intrinsic factor
    intrinsic_factor: 5.0
    # k in knn
    k_knn: 10
    # if test the cost estimate error
    test_estimate: True
    # constant intrinsic cost added to every transition (None to use KNN-based intrinsic cost).
    # Only read when constant_cost_source is 'fixed' -- ignored entirely under 'ep_cost'/'excess_cost'.
    constant_cost: ~
    # decay schedule for constant_cost: None (no decay), 'exponential', or 'step'. Only read
    # when constant_cost_source is 'fixed' -- 'ep_cost'/'excess_cost' never decay (see below).
    cost_decay_type: ~
    # exponential: effective_cost = constant_cost * cost_decay_rate^epoch
    # half-life ~46 epochs → ~1% of initial value by epoch 300
    cost_decay_rate: 0.985
    # step: effective_cost = constant_cost * cost_decay_factor^(epoch // cost_decay_step_interval)
    # factor=0.4, interval=50 → 6 drops → ~0.4% of initial value by epoch 300
    cost_decay_step_interval: 50
    cost_decay_factor: 0.4
    # How the "constant" intrinsic cost is determined once constant_cost (or one of the two
    # self-tracking modes below) is active, instead of the default KNN-based novelty signal:
    #   'fixed'       -- constant_cost (optionally annealed by cost_decay_type above). Must set
    #                    constant_cost to a float for this mode to actually trigger.
    #   'ep_cost'     -- self-tracking: every path uses the live running mean of Metrics/EpCost
    #                    (the same rolling-window stat CPO's own trust-region step reads),
    #                    refreshed as episodes complete. Never goes to zero even once the
    #                    constraint is satisfied -- it tracks EpCost itself, not the violation.
    #   'excess_cost' -- same live-tracking idea, but clamped to max(Metrics/EpCost - cost_limit,
    #                    0.0): how far over budget the policy currently is, not its raw cost.
    #                    Self-extinguishing -- goes to exactly 0 once EpCost <= cost_limit, rather
    #                    than continuing to apply a deflation the policy no longer needs. Always
    #                    >= 0 by construction. Reads algo_cfgs.cost_limit (same value CPO's own
    #                    trust-region check uses).
    # Both 'ep_cost' and 'excess_cost' ignore constant_cost/cost_decay_type entirely -- no decay
    # schedule applies since the value already moves with training. Before any episode anywhere
    # in the run has completed (empty logger window), both fall back to 0.0 (no intrinsic
    # penalty yet) rather than erroring.
    constant_cost_source: fixed
    # if True, intrinsic_costs are zeroed out of deltas_n. Under the default KNN-adaptive
    # mechanism (constant_cost unset) this only affects the deltas_n diagnostic scatter plots and
    # the beta-adaptation-rate signal -- the real adv_c/target_value_c (built from a separately-
    # computed `deltas` that always includes beta*intrinsic_costs) is unaffected. Under any
    # constant_cost mode ('fixed'/'ep_cost'/'excess_cost') there is no separate `deltas` --
    # deltas_n IS what feeds adv_c/target_value_c directly, so here this flag actually strips the
    # constant intrinsic cost out of the cost critic's target and the cost-advantage
    # policy-gradient term too, not just the diagnostics. The intrinsic cost still reaches the
    # CPO trust-region feasibility check via ep_discount_ci regardless of this flag either way.
    no_intrinsic_in_deltas: False
    # eval frequency for the first 100 epochs (higher cadence for early monitoring)
    early_eval_freq: 5
    value_eval_freq: 50
    # number of full episodes rolled out per calibration eval (see test_estimate above)
    value_eval_episodes: 100
    # same-layout Monte-Carlo value study (see omnisafe.utils.value_eval.
    # estimate_true_value_same_state_mc), run via PolicyGradient._run_eval_studies (shared with
    # CPO/TRPOPID -- see mice.py's learn()). On by default, matching CPO.yaml -- adds meaningful
    # eval-epoch cost (mc_value_study_probes * mc_value_study_repeats extra full episodes);
    # disable per-run if that cost isn't wanted.
    mc_value_study: True
    mc_value_study_probes: 17
    mc_value_study_repeats: 10
    mc_value_study_seed_offset: 100000
    mc_value_study_vector_envs: 5
    mc_eval_bootstrap_threshold: 0.01
    # on-policy intermediate-state value study (see omnisafe.utils.value_eval.
    # estimate_value_from_snapshots) -- on by default, matching CPO.yaml, same rationale as
    # mc_value_study above. Also gates PooledMC/Correlation_r/_c and
    # PooledMC/GradientAlignment_r/_c, which pool this study's states with mc_value_study's s0
    # probes (see pool_correlation_stats's docstring).
    intermediate_state_study: True
    intermediate_state_study_positions: [100, 300, 500, 700, 900]
    intermediate_state_study_probes: 17
    intermediate_state_study_repeats: 10
  # logger configurations
  logger_cfgs:
    # use wandb for logging
    use_wandb: True
    # wandb project name
    wandb_project: calibration_rl
    # use tensorboard for logging
    use_tensorboard: True
    # save model frequency
    save_model_freq: 100
    # save logger path
    log_dir: "./runs"
    # save model path
    window_lens: 100
  # model configurations
  model_cfgs:
    # weight initialization mode
    weight_initialization_mode: "kaiming_uniform"
    # actor type, options: gaussian, gaussian_learning
    actor_type: gaussian_learning
    # linear learning rate decay
    linear_lr_decay: True
    # exploration noise anneal
    exploration_noise_anneal: False
    # std upper bound, and lower bound
    std_range: [0.5, 0.1]
    # embedding dimension
    emb_dim: 8
    # actor network configurations
    actor:
      # hidden layer sizes
      hidden_sizes: [64, 64]
      # activation function
      activation: tanh
      # out_activation: tanh
      # learning rate
      lr: ~
    critic:
      # hidden layer sizes
      hidden_sizes: [64, 64]
      # activation function
      activation: tanh
      # learning rate
      lr: 0.001

  env_cfgs:
    lidar_num_bins: ~
SafeMetaDrive:
  # training configurations
  train_cfgs:
    # total number of steps to train
    total_steps: 500000
  # logger configurations
  logger_cfgs:
    # save model frequency
    save_model_freq: 15
  # algorithm configurations
  algo_cfgs:
    # batch size for each iteration
    batch_size: 512
    # number of steps to update the policy
    steps_per_epoch: 3000
    # number of iterations to update the policy
    update_iters: 10
    # normalize reward
    reward_normalize: False
    # normalize cost
    cost_normalize: True
    # normalize observation
    obs_normalize: False
    # max gradient norm
    max_grad_norm: 20.0
    cost_limit: 1
  # model configurations
  model_cfgs:
    # actor network configurations
    actor:
      # size of hidden layers
      hidden_sizes: [256, 256]
      # learning rate
      lr: 0.00005
    # critic network configurations
    critic:
      # size of hidden layers
      hidden_sizes: [256, 256]
      # learning rate
      lr: 0.00005
  # environment specific configurations
  env_cfgs:
  # safe meta drive configurations. More details refer to https://github.com/decisionforce/EGPO
    meta_drive_config:
      # max iterations of interactions
      horizon: 1500
      # whether to use random traffic
      random_traffic: False
      # the penalty when crash into other vehicles
      crash_vehicle_penalty: 1.
      # the penalty when crash into other objects
      crash_object_penalty: 0.5
      # the penalty when out of road
      out_of_road_penalty: 1.
