algo: SACLag
env_id: SafetyPointGoal1-v0
train_cfgs:
  device: cuda:1
  torch_threads: 2
  vector_env_nums: 1
  parallel: 1
  total_steps: 2000000
  eval_episodes: 1
  epochs: 1500
algo_cfgs:
  steps_per_epoch: 2000
  update_cycle: 1
  update_iters: 1
  size: 1000000
  batch_size: 256
  reward_normalize: false
  cost_normalize: false
  obs_normalize: false
  max_grad_norm: 40
  use_critic_norm: false
  critic_norm_coeff: 0.001
  polyak: 0.005
  gamma: 0.99
  start_learning_steps: 10000
  policy_delay: 2
  use_exploration_noise: false
  exploration_noise: 0.1
  policy_noise: 0.2
  policy_noise_clip: 0.5
  alpha: 1.0e-05
  auto_alpha: false
  use_cost: true
  warmup_epochs: 100
model_cfgs:
  weight_initialization_mode: kaiming_uniform
  actor_type: gaussian_sac
  linear_lr_decay: false
  actor:
    hidden_sizes:
    - 256
    - 256
    activation: relu
    lr: 5.0e-06
  critic:
    num_critics: 2
    hidden_sizes:
    - 256
    - 256
    activation: relu
    lr: 0.001
lagrange_cfgs:
  cost_limit: 25.0
  lagrangian_multiplier_init: 0.0
  lambda_lr: 5.0e-07
  lambda_optimizer: Adam
  lagrangian_upper_bound: null
logger_cfgs:
  use_wandb: false
  use_tensorboard: true
seed: 0
